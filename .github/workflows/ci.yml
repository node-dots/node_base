name: CI

# Перевіряємо PR та зміни в основних гілках.
on:
  pull_request:
    branches: ['**']
  push:
    branches: [develop, main]

# Для перевірок достатньо читання репозиторію.
permissions:
  contents: read

jobs:
  check:
    name: Code checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Отримати код
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Налаштувати Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Встановити залежності
        run: npm ci

      - name: Перевірити форматування, синтаксис і тести
        run: npm run check

  mongodb-integration:
    name: MongoDB integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Отримати код
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Налаштувати Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Встановити залежності
        run: npm ci

      - name: Запустити MongoDB replica set
        run: |
          docker run --detach \
            --name task-mongodb \
            --publish 127.0.0.1:27017:27017 \
            mongo:8.2.12 \
            mongod --replSet rs0 --bind_ip_all

          timeout 60 bash -c 'until docker exec task-mongodb mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" | grep -qx 1; do sleep 2; done'
          docker exec task-mongodb mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          timeout 60 bash -c 'until docker exec task-mongodb mongosh --quiet --eval "rs.status().myState" | grep -qx 1; do sleep 2; done'

      - name: Виконати MongoDB integration tests
        run: npm run test:mongodb

      - name: Показати журнал MongoDB після помилки
        if: failure()
        run: docker logs task-mongodb

  macos-integration:
    name: macOS checks and MongoDB integration
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run formatting, syntax, and unit/HTTP checks
        run: npm run check

      - name: Install MongoDB Community 8.0
        run: |
          brew tap mongodb/brew
          brew trust mongodb/brew
          brew install mongodb-community@8.0

      - name: Start MongoDB replica set
        run: |
          mkdir -p "$RUNNER_TEMP/mongodb-data"
          mongod --dbpath "$RUNNER_TEMP/mongodb-data" \
            --replSet rs0 --bind_ip 127.0.0.1 --fork \
            --logpath "$RUNNER_TEMP/mongodb.log"
          mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          for attempt in {1..30}; do
            if mongosh --quiet --eval 'rs.status().myState' | grep -qx 1; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/mongodb.log"
          exit 1

      - name: Run MongoDB integration tests
        run: npm run test:mongodb
